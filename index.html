<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Meal Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🍴 Weekly Meal Planner</h1>
        <p>Plan your meals for the whole week.</p>

        <div class="meal-planner">

            <div class="day">
                <h2>Monday</h2>

                <label>Breakfast</label>
                <input type="text" id="monday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="monday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="monday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Tuesday</h2>

                <label>Breakfast</label>
                <input type="text" id="tuesday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="tuesday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="tuesday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Wednesday</h2>

                <label>Breakfast</label>
                <input type="text" id="wednesday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="wednesday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="wednesday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Thursday</h2>

                <label>Breakfast</label>
                <input type="text" id="thursday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="thursday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="thursday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Friday</h2>

                <label>Breakfast</label>
                <input type="text" id="friday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="friday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="friday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Saturday</h2>

                <label>Breakfast</label>
                <input type="text" id="saturday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="saturday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="saturday-dinner"
                    placeholder="Enter dinner">
            </div>

            <div class="day">
                <h2>Sunday</h2>

                <label>Breakfast</label>
                <input type="text" id="sunday-breakfast"
                    placeholder="Enter breakfast">

                <label>Lunch</label>
                <input type="text" id="sunday-lunch"
                    placeholder="Enter lunch">

                <label>Dinner</label>
                <input type="text" id="sunday-dinner"
                    placeholder="Enter dinner">
            </div>

        </div>

        <button onclick="saveMealPlan()">Save Meal Plan</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
